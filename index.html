<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影视评分助手 - Movie Rating Finder</title>
    <style>
        :root {
            --bg-primary: #0A0D12;
            --bg-secondary: #0F131C;
            --bg-tertiary: #161D2B;
            --bg-card: #1E2636;
            --accent: #38BDF8;
            --accent-hover: #0EA5E9;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border: #334155;
            --success: #6EE7B7;
            --warning: #FCD34D;
            --error: #F87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
        }

        header {
            text-align: center;
            padding: clamp(2rem, 5vw, 4rem) 0;
            position: relative;
        }

        .settings-btn {
            position: absolute;
            top: 2rem;
            right: 0;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .settings-btn:hover {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--text-secondary);
        }

        .search-section {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: clamp(1.5rem, 4vw, 3rem);
            margin-bottom: 3rem;
        }

        .search-box {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr auto;
        }

        @media (max-width: 640px) {
            .search-box {
                grid-template-columns: 1fr;
            }
            .settings-btn {
                position: static;
                margin: 0 auto 1rem;
            }
        }

        .search-input {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 999px;
            padding: 1rem 1.5rem;
            font-size: 1.125rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .search-btn {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 999px;
            padding: 1rem 2.5rem;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            border-color: var(--border);
        }

        .tab.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
            }
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: var(--bg-tertiary);
        }

        .movie-info {
            padding: 0.75rem;
        }

        .movie-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.3;
        }

        .movie-meta {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .movie-year {
            color: var(--text-secondary);
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--bg-tertiary);
            border-radius: 999px;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .rating-badge.high {
            color: var(--success);
        }

        .rating-badge.medium {
            color: var(--warning);
        }

        .rating-badge.low {
            color: var(--error);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            padding: 2rem;
        }

        @media (max-width: 768px) {
            .modal-header {
                grid-template-columns: 1fr;
            }
        }

        .modal-poster {
            width: 100%;
            border-radius: 12px;
        }

        .modal-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .modal-ratings {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .modal-body {
            padding: 0 2rem 2rem;
        }

        .detail-section {
            margin-bottom: 1.5rem;
        }

        .detail-section h3 {
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .detail-section p {
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .close-btn {
            position: sticky;
            top: 1rem;
            right: 1rem;
            float: right;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .error-message {
            background: var(--bg-card);
            border-left: 4px solid var(--error);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
            color: var(--text-secondary);
        }

        .setup-notice {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(110, 231, 183, 0.1));
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .setup-notice h3 {
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .setup-notice p {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .setup-notice a {
            color: var(--accent);
            text-decoration: none;
        }

        .setup-notice a:hover {
            text-decoration: underline;
        }

        /* 设置弹窗样式 */
        .settings-modal-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
        }

        .settings-modal-content h2 {
            margin-bottom: 1.5rem;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group .help-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .form-input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 999px;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            flex: 1;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 2px solid var(--border);
            border-radius: 999px;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        .success-message {
            background: var(--bg-card);
            border-left: 4px solid var(--success);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: var(--success);
        }

        .api-links {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .api-links h4 {
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .api-links a {
            display: block;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .api-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="settings-btn" onclick="openSettings()">
                ⚙️ 设置
            </button>
            <h1>🎬 影视评分助手</h1>
            <p class="subtitle">聚合权威评分，快速找到好片</p>
        </header>

        <div id="setupNotice" class="setup-notice" style="display: none;">
            <h3>👋 欢迎使用！</h3>
            <p>首次使用需要配置API密钥（完全免费）。点击右上角的 <strong>⚙️ 设置</strong> 按钮开始配置。</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="搜索电影或美剧名称..."
                    onkeypress="if(event.key==='Enter') searchMovies()"
                >
                <button class="search-btn" onclick="searchMovies()">搜索</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('popular')">🔥 正在热播</button>
            <button class="tab" onclick="switchTab('top_rated')">⭐ 高分推荐</button>
            <button class="tab" onclick="switchTab('tv_series')">📺 英美剧集</button>
            <button class="tab" onclick="switchTab('action')">💥 动作</button>
            <button class="tab" onclick="switchTab('drama')">🎭 剧情</button>
            <button class="tab" onclick="switchTab('comedy')">😄 喜剧</button>
            <button class="tab" onclick="switchTab('scifi')">🚀 科幻</button>
        </div>

        <div id="results" class="results"></div>
    </div>

    <!-- 电影详情弹窗 -->
    <div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
        <div class="settings-modal-content">
            <h2>⚙️ API 设置</h2>

            <div id="successMessage" class="success-message" style="display: none;">
                ✓ 保存成功！
            </div>

            <div class="form-group">
                <label for="tmdbKey">TMDb API Key（必需）</label>
                <input type="text" id="tmdbKey" class="form-input" placeholder="输入你的 TMDb API Key">
                <p class="help-text">用于获取电影数据和评分</p>
            </div>

            <div class="form-group">
                <label for="omdbKey">OMDb API Key（可选）</label>
                <input type="text" id="omdbKey" class="form-input" placeholder="输入你的 OMDb API Key">
                <p class="help-text">用于获取 IMDb 和烂番茄评分，不填写仅显示 TMDb 评分</p>
            </div>

            <div class="api-links">
                <h4>📖 如何获取 API Key？</h4>
                <a href="https://www.themoviedb.org/settings/api" target="_blank">→ 申请 TMDb API（免费）</a>
                <a href="http://www.omdbapi.com/apikey.aspx" target="_blank">→ 申请 OMDb API（免费）</a>
            </div>

            <div class="form-actions">
                <button class="btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let TMDB_KEY = localStorage.getItem('tmdb_key') || '';
        let OMDB_KEY = localStorage.getItem('omdb_key') || '';
        const TMDB_BASE = 'https://api.themoviedb.org/3';
        const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

        const genreMap = {
            'action': 28,
            'drama': 18,
            'comedy': 35,
            'scifi': 878
        };

        let currentTab = 'popular';

        // 设置相关函数
        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
            document.getElementById('tmdbKey').value = TMDB_KEY;
            document.getElementById('omdbKey').value = OMDB_KEY;
            document.getElementById('successMessage').style.display = 'none';
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function saveSettings() {
            const tmdbKey = document.getElementById('tmdbKey').value.trim();
            const omdbKey = document.getElementById('omdbKey').value.trim();

            if (!tmdbKey) {
                alert('请至少填写 TMDb API Key');
                return;
            }

            localStorage.setItem('tmdb_key', tmdbKey);
            localStorage.setItem('omdb_key', omdbKey);

            TMDB_KEY = tmdbKey;
            OMDB_KEY = omdbKey;

            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('setupNotice').style.display = 'none';

            setTimeout(() => {
                closeSettings();
                if (document.getElementById('results').innerHTML === '') {
                    switchTab('popular');
                }
            }, 1500);
        }

        // 电影数据获取
        async function fetchMovies(endpoint) {
            try {
                const response = await fetch(`${TMDB_BASE}${endpoint}&api_key=${TMDB_KEY}`);
                const data = await response.json();
                return data.results || [];
            } catch (error) {
                console.error('Error fetching movies:', error);
                return [];
            }
        }

        async function searchMovies() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (!TMDB_KEY) {
                alert('请先在设置中配置 TMDb API Key');
                openSettings();
                return;
            }

            showLoading();
            const endpoint = `/search/multi?query=${encodeURIComponent(query)}&language=zh-CN`;
            const movies = await fetchMovies(endpoint);
            displayMovies(movies.filter(m => m.media_type === 'movie' || m.media_type === 'tv'));
        }

        async function switchTab(tab) {
            if (!TMDB_KEY) {
                alert('请先在设置中配置 TMDb API Key');
                openSettings();
                return;
            }

            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            showLoading();
            let endpoint;

            if (tab === 'popular') {
                endpoint = '/movie/popular?language=zh-CN&page=1';
            } else if (tab === 'top_rated') {
                endpoint = '/movie/top_rated?language=zh-CN&page=1';
            } else if (tab === 'tv_series') {
                endpoint = '/discover/tv?with_original_language=en&language=zh-CN&page=1&sort_by=vote_average.desc&vote_count.gte=100';
            } else if (genreMap[tab]) {
                endpoint = `/discover/movie?with_genres=${genreMap[tab]}&language=zh-CN&page=1&sort_by=vote_average.desc&vote_count.gte=100`;
            }

            const movies = await fetchMovies(endpoint);
            displayMovies(movies);
        }

        function showLoading() {
            document.getElementById('results').innerHTML = `
                <div class="loading" style="grid-column: 1/-1;">
                    <div class="spinner"></div>
                    <p>正在加载...</p>
                </div>
            `;
        }

        function displayMovies(movies) {
            const resultsDiv = document.getElementById('results');

            if (!movies || movies.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="error-message" style="grid-column: 1/-1;">
                        <p>😔 没有找到相关内容</p>
                    </div>
                `;
                return;
            }

            // 按评分从高到低排序
            movies.sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0));

            resultsDiv.innerHTML = movies.map(movie => {
                const title = movie.title || movie.name;
                const poster = movie.poster_path ? `${TMDB_IMG}${movie.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                const year = (movie.release_date || movie.first_air_date || '').split('-')[0];
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A';
                const ratingClass = rating >= 7 ? 'high' : rating >= 5 ? 'medium' : 'low';

                return `
                    <div class="movie-card" onclick="showDetails(${movie.id}, '${movie.media_type || 'movie'}')">
                        <img src="${poster}" alt="${title}" class="movie-poster">
                        <div class="movie-info">
                            <h3 class="movie-title">${title}</h3>
                            <div class="movie-meta">
                                <span>${year || '未知'}</span>
                                <span>•</span>
                                <span>${movie.media_type === 'tv' ? '剧集' : '电影'}</span>
                            </div>
                            <div class="rating">
                                <span class="rating-badge ${ratingClass}">
                                    ⭐ ${rating}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function showDetails(id, type) {
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            modal.classList.add('active');
            modalContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';

            try {
                const tmdbResponse = await fetch(`${TMDB_BASE}/${type}/${id}?api_key=${TMDB_KEY}&language=zh-CN`);
                const tmdbData = await tmdbResponse.json();

                const title = tmdbData.title || tmdbData.name;
                const imdbId = tmdbData.imdb_id;

                let omdbRating = 'N/A';
                let rtRating = 'N/A';

                if (imdbId && OMDB_KEY) {
                    try {
                        const omdbResponse = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_KEY}`);
                        const omdbData = await omdbResponse.json();
                        omdbRating = omdbData.imdbRating || 'N/A';
                        const rtObj = omdbData.Ratings?.find(r => r.Source === 'Rotten Tomatoes');
                        rtRating = rtObj?.Value || 'N/A';
                    } catch (e) {
                        console.error('OMDb error:', e);
                    }
                }

                const poster = tmdbData.poster_path ? `${TMDB_IMG}${tmdbData.poster_path}` : 'https://via.placeholder.com/300x450';
                const year = (tmdbData.release_date || tmdbData.first_air_date || '').split('-')[0];
                const runtime = tmdbData.runtime ? `${tmdbData.runtime}分钟` : tmdbData.number_of_seasons ? `${tmdbData.number_of_seasons}季` : '未知';
                const genres = tmdbData.genres?.map(g => g.name).join('、') || '未分类';

                modalContent.innerHTML = `
                    <div class="modal-header">
                        <img src="${poster}" alt="${title}" class="modal-poster">
                        <div class="modal-info">
                            <h2>${title}</h2>
                            <div class="movie-meta">
                                <span>${year}</span>
                                <span>•</span>
                                <span>${runtime}</span>
                            </div>
                            <div class="modal-ratings">
                                <span class="rating-badge high">TMDb: ${tmdbData.vote_average?.toFixed(1) || 'N/A'} (${tmdbData.vote_count?.toLocaleString() || 0}人)</span>
                                ${OMDB_KEY ? `<span class="rating-badge high">IMDb: ${omdbRating}</span>` : ''}
                                ${OMDB_KEY ? `<span class="rating-badge medium">🍅 ${rtRating}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="modal-body">
                        <div class="detail-section">
                            <h3>类型</h3>
                            <p>${genres}</p>
                        </div>
                        <div class="detail-section">
                            <h3>剧情简介</h3>
                            <p>${tmdbData.overview || '暂无简介'}</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                modalContent.innerHTML = `
                    <div class="error-message">
                        <p>加载失败，请稍后重试</p>
                    </div>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 初始化
        window.onload = () => {
            if (!TMDB_KEY) {
                document.getElementById('setupNotice').style.display = 'block';
            } else {
                switchTab('popular');
            }
        };
    </script>
</body>
</html>
